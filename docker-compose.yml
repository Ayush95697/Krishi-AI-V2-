version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: krishiai_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-localpassword}
      MYSQL_DATABASE: ${DB_NAME:-krishiai}
      MYSQL_USER: ${DB_USER:-krishi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-localpassword}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: krishiai_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-krishi_user}
      - DB_PASSWORD=${DB_PASSWORD:-localpassword}
      - DB_NAME=${DB_NAME:-krishiai}
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: krishiai_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
